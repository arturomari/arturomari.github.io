<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menú Completo | ARTURO'S PIZZERIA</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/journal/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm"
    >
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">ARTURO'S PIZZERIA</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarColor01"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarColor01">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="menu.html">Menú Completo</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="pedidos.html">Mis Pedidos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html#contacto">Contacto</a>
            </li>
          </ul>
          <ul class="navbar-nav ms-2" id="nav-auth-area">
            <!-- Rellenado por menu.js -->
          </ul>
          <button class="btn btn-outline-light position-relative ms-3"
                  data-bs-toggle="modal" data-bs-target="#modalCarrito">
            <i class="bi bi-cart3 fs-5"></i>
            <span id="carrito-badge"
                  class="position-absolute top-0 start-100 translate-middle
                         badge rounded-pill bg-danger"
                  style="display:none;">0</span>
          </button>
        </div>
      </div>
    </nav>

    <header class="bg-light py-5 border-bottom">
      <div class="container text-center">
        <h1 class="display-3 fw-bold text-primary">Nuestra Carta</h1>
        <p class="lead text-muted">
          Selección de ingredientes premium para paladares exigentes.
        </p>
      </div>
    </header>

    <section class="py-5">
      <div class="container">
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4" id="lista-pizzas">
          <!-- Rellenado por menu.js desde la API -->
        </div>
      </div>
    </section>

    <footer class="bg-primary text-white text-center py-5 mt-5">
      <div class="container">
        <p class="mb-0 fs-5 fw-bold">ARTURO'S PIZZERIA</p>
        <small class="opacity-75"
          >&copy; 2026 Todos los derechos reservados.</small
        >
      </div>
    </footer>

    <!-- Modal Carrito -->
    <div class="modal fade" id="modalCarrito" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-scrollable modal-lg">
        <div class="modal-content">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title"><i class="bi bi-cart3 me-2"></i>Tu Carrito</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="carrito-cuerpo">
            <p class="text-center text-muted py-3">El carrito está vacío.</p>
          </div>
          <div class="modal-footer justify-content-start" id="carrito-pie">
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Login / Registro -->
    <div class="modal fade" id="modalLogin" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title">Accede a tu cuenta</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <ul class="nav nav-tabs mb-3">
              <li class="nav-item">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabLogin">Iniciar Sesión</button>
              </li>
              <li class="nav-item">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabRegistro">Registrarse</button>
              </li>
            </ul>
            <div class="tab-content">
              <div class="tab-pane fade show active" id="tabLogin">
                <div id="login-error" class="alert alert-danger d-none"></div>
                <div class="mb-3">
                  <label class="form-label">Email</label>
                  <input type="email" class="form-control" id="login-email" placeholder="tu@email.com">
                </div>
                <div class="mb-3">
                  <label class="form-label">Contraseña</label>
                  <input type="password" class="form-control" id="login-password" placeholder="Tu contraseña">
                </div>
                <button class="btn btn-primary w-100" id="btn-login">Entrar</button>
              </div>
              <div class="tab-pane fade" id="tabRegistro">
                <div id="reg-error" class="alert alert-danger d-none"></div>
                <div class="mb-3">
                  <label class="form-label">Nombre</label>
                  <input type="text" class="form-control" id="reg-nombre" placeholder="Tu nombre">
                </div>
                <div class="mb-3">
                  <label class="form-label">Email</label>
                  <input type="email" class="form-control" id="reg-email" placeholder="tu@email.com">
                </div>
                <div class="mb-3">
                  <label class="form-label">Contraseña</label>
                  <input type="password" class="form-control" id="reg-password" placeholder="Mínimo 6 caracteres">
                </div>
                <button class="btn btn-primary w-100" id="btn-registro">Crear cuenta</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="api.js"></script>
    <script src="menu.js"></script>
  </body>
</html>
